<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二進制與十進制互換工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div class="shell nav"><a class="brand" href="index.html">首頁</a><nav class="nav-links" aria-label="Site navigation"><a href="note.html">高中筆記</a><a href="try.html">測試區</a><a href="game.html">遊戲區</a><a href="https://zw7305549-commits.github.io/first_game/" target="_blank" rel="noopener">網頁射擊遊戲</a></nav></div></header>
  <main class="shell tool-page">
    <section class="page-head"><h1>二進制 ↔ 十進制</h1></section>
    <section class="tool-card converter-card">
      <input id="inputNumber" type="text" inputmode="numeric" placeholder="輸入數字" aria-label="輸入數字">
      <div class="tool-actions"><button class="tool-button" onclick="toBinary()">十進制 → 二進制</button><button class="tool-button" onclick="toDecimal()">二進制 → 十進制</button></div>
      <div id="output" class="converter-output" aria-live="polite"></div>
    </section>
  </main>
  <span class="signature">烜</span>
  <script>
    function toBinary() {
      const input = document.getElementById('inputNumber').value;
      const n = parseInt(input, 10);
      if (isNaN(n)) { document.getElementById('output').innerText = '請輸入正確的十進制數字！'; return; }
      document.getElementById('output').innerText = `${n} 的二進制是 ${n.toString(2)}`;
    }
    function toDecimal() {
      const input = document.getElementById('inputNumber').value;
      if (!/^[01]+$/.test(input)) { document.getElementById('output').innerText = '請輸入正確的二進制數字！（只能包含 0 和 1）'; return; }
      document.getElementById('output').innerText = `${input} 的十進制是 ${parseInt(input, 2)}`;
    }
  </script>
</body>
</html>
