<!DOCTYPE html>

  <title>筆記下載區</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: left;
      margin-top: 50px;
      background-color: #a3e1da;
      font-size: 20px;
    }

    h1 {
      color: #000000;
    }

    button {
      padding: 20px 40px; /* 適中大小 */
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #b82121;
      color: rgb(254, 254, 254);
      margin: 10px; /* 按鈕間距 */
    }
    .plain-link {
    color: inherit;          /* 跟內文同色 */
    text-decoration: none;   /* 移除底線 */
    cursor: pointer;         /* 滑鼠變手指，可提示可點 */
    }
    /* 內文 */
    .history-section {
      display: flex;
      justify-content: left; /* 文字靠左 */ 
      color: #403f30;
    }
    .civics-section {
      display: flex;
      justify-content: left; /* 文字靠左 */ 
      color: #403f30;
    }
    .earth-Science-section {
      display: flex;
      justify-content: left; /* 文字靠左 */ 
      color: #403f30;
    }
      button:hover {
      background-color: #ff5900;
    }
    /* 個別樣式 */
    /* button */
    /* 歷史 */
    /* 建議：給按鈕加上 class="history-btn" 並用此選擇器 */
    .history-btn {
      font-size: 15px;
      padding: 25px 25px;
      background-color: #ff6f00; 
      color: white;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      margin: 5px;
    }
    /* 公民 */
    .civics-btn {

      padding: 25px 25px;
      background-color: #2297f6; 
      color: white;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      margin: 5px;

    /* earth-Science-btn */

      padding: 25px 25px;
      background-color: #087e01; 
      color: white;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      margin: 5px;
    }
    
  </style>
</head>
