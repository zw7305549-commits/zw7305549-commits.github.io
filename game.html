<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遊戲區</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div class="shell nav"><a class="brand" href="index.html">首頁</a><nav class="nav-links" aria-label="Site navigation"><a href="note.html">高中筆記</a><a href="try.html">測試區</a><a href="game.html">遊戲區</a><a href="https://zw7305549-commits.github.io/first_game/" target="_blank" rel="noopener">網頁射擊遊戲</a></nav></div></header>
  <main class="shell tool-page">
    <section class="page-head"><h1>遊戲區</h1></section>
    <section class="tool-card game-card">
      <h2>猜數字</h2>
      <p>猜一個 1～50 的數字</p>
      <div class="tool-actions"><input type="number" id="guessInput" min="1" max="50" placeholder="輸入數字"><button class="tool-button" id="guessBtn">送出</button><button class="tool-button secondary" id="resetBtn">重置</button><button class="tool-button secondary" id="showAnswerBtn">看答案</button></div>
      <p id="result" class="game-result" aria-live="polite"></p>
    </section>
  </main>
  <span class="signature">烜</span>
  <script>
    let answer = Math.floor(Math.random() * 50) + 1;
    const guessBtn = document.getElementById('guessBtn');
    const resetBtn = document.getElementById('resetBtn');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const guessInput = document.getElementById('guessInput');
    const result = document.getElementById('result');
    guessBtn.addEventListener('click', () => {
      const guess = Number(guessInput.value);
      if (!guess || guess < 1 || guess > 50) { result.textContent = '⚠️ 請輸入 1~50 的數字！'; return; }
      if (guess === answer) result.textContent = '🎉 恭喜答對！答案就是 ' + answer;
      else if (guess > answer) result.textContent = '太大了！再試一次！';
      else result.textContent = '太小了！再試一次！';
    });
    resetBtn.addEventListener('click', () => { answer = Math.floor(Math.random() * 50) + 1; guessInput.value = ''; result.textContent = '🔄 遊戲已重置，請重新輸入！'; });
    showAnswerBtn.addEventListener('click', () => { result.textContent = '📢 答案是：' + answer; });
  </script>
</body>
</html>
